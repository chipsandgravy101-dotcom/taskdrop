<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>TaskDrop — Focus</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="overlay-shell">
      <p class="eyebrow">
        <span>TASKDROP · NON-SKIPPABLE</span>
        <span class="move-hint">DRAG TO MOVE</span>
      </p>
      <h1>These tasks need your attention</h1>
      <p class="intro">Complete each item to close this screen.</p>
      <section id="items" class="overlay-items" aria-live="polite"></section>
    </main>
    <script src="overlay.js"></script>
  </body>
</html>
